# Render Blueprint: the FastAPI backend plus a managed PostgreSQL database.
# Render → New → Blueprint → pick this repository. See deployment.md.
services:
  - type: web
    name: circular-marketplace-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: circular-marketplace-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # Render creates a strong random secret
      - key: FRONTEND_ORIGIN
        sync: false                  # set to the Vercel URL after the frontend is deployed
      - key: SEED_DEMO_DATA
        value: "true"                # load demo data on startup when the database is empty
      - key: EMAIL_DEV_MODE
        value: "true"                # demo site: codes via "Show my code"; set SMTP_* and false for real email

databases:
  - name: circular-marketplace-db
    plan: free
    databaseName: circular
    user: circular
